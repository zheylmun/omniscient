# Copy to omniscient.toml in your repo root and edit.
# Language whitelist. Empty (the default) indexes every language: tree-sitter
# chunking for rust/python/javascript/typescript/tsx, line windows for the rest.
# Entries match a language name ("tsx"), a family ("typescript" also admits
# .tsx), or a raw extension ("rs"), case-insensitive.
languages = []
# Strip leading banner comments (license headers, module doc comments) from search
# results. Inline comments are preserved — they carry implementation intent.
# The old key name 'strip_comments' is still accepted for backward compatibility.
strip_banner_comments = true

# Dependency lock files (Cargo.lock, package-lock.json, yarn.lock, pnpm-lock.yaml,
# poetry.lock, go.sum, ...) are ALWAYS skipped — large, generated, pure noise.
# This is not affected by index_tests below.

# Test/fixture files (tests/, benches/, **/*.test.*, **/*.spec.*, **/*_test.*,
# **/test_*.py, **/conftest.py, **/__tests__/) are skipped by default. Set true
# to index them too.
index_tests = false

# Extra glob patterns to skip when indexing, in addition to the built-in lock-file
# and test excludes above. Matched against repo-relative paths. .gitignore is always honored.
exclude = []   # e.g. ["vendor/**", "**/*.generated.rs"]

[embedder]
base_url = "http://localhost:8080"   # local llama.cpp serving an embedding model

# The model id sent on every embeddings request, and the id the /props?model=
# capability probe is scoped to. It MUST be an id the endpoint actually serves:
# a bare `llama-server` ignores the field, but `llama serve` routes by it and
# answers an unknown id with `400 model '<id>' not found`. `llama serve` registers
# a -hf-loaded model under the repo id, which is why this defaults to the same
# string as hf_repo below. Check `curl localhost:8080/v1/models` if in doubt;
# `omniscient doctor` reports the id it connected as.
#
# Default is Qwen3-Embedding-0.6B (~640 MB, CPU-viable) so omniscient works on an
# ordinary developer machine. With GPU memory to spare, set BOTH this and hf_repo
# to Qwen/Qwen3-Embedding-4B-GGUF:Q4_K_M or Qwen/Qwen3-Embedding-8B-GGUF:Q8_0 for
# better retrieval — pooling = "last" is correct for all three. The model id keys
# the index, so changing it triggers a full rebuild on the next run.
model = "Qwen/Qwen3-Embedding-0.6B-GGUF:Q8_0"
# Bearer token for an authenticated endpoint (a llama.cpp server started with
# --api-key, or an OpenAI-compatible router). Sent as `Authorization: Bearer <key>`.
# Omit for an unauthenticated local server. A whole-string ${VAR} or $VAR is read
# from the environment at startup (errors if unset), so the secret stays out of
# this file; any other value is used literally. Note: over plain HTTP the token is
# not encrypted in transit — prefer a trusted LAN or an HTTPS endpoint.
# api_key = "${OMNISCIENT_API_KEY}"

# Embedding requests are split into batches so a massive file can't overload the
# GPU. A batch is flushed before it would exceed either bound (a single chunk
# larger than max_batch_bytes is sent on its own). When auto_start launches the
# server, max_batch_bytes also sizes its --ctx-size/--batch-size/--ubatch-size.
# That sizing is deliberately generous, not a requirement: llama.cpp enforces only
# per-input size (batch totals are not bounded by n_ctx, and a pooled sequence is
# split across ubatches), and a token is always >= 1 byte, so max_batch_bytes is a
# safe ceiling on any single request. It costs memory on a spawned server; lowering
# it is a performance trade-off, not a correctness risk.
max_batch_chunks = 64       # max chunks per embed request
max_batch_bytes = 32000     # max total bytes per embed request (~8k tokens)

# Chunks are split so no single one exceeds the endpoint's context window — an
# oversized chunk is rejected outright and would otherwise fail every reconcile.
# The budget is adaptive: omniscient asks the server for its real limit at startup
# (GET /props?model=<id>, then plain /props, then /v1/models), starts optimistic
# from it, and folds every "context exceeded" rejection back in as an exact
# measurement. NOTE the correction only ever ratchets DOWN — an overflow is the
# only signal, and it fires only when a chunk is too big. A seed that is too high
# self-heals in a round or two; one that is too low never generates an overflow, so
# nothing corrects it. That is why this knob only applies when the endpoint reports
# no window at all, and why it stays conservative. `omniscient doctor` reports the
# window it found and which probe answered.
max_chunk_tokens = 2048     # seed per-input token limit when the server reports none

# Concurrent embedding requests during reconcile. Leave unset (comment out) to
# derive it from the server's reported slot count (/props total_slots, capped at
# 8), falling back to serial for an endpoint that reports none. Scoping the probe
# with ?model= is what makes this work behind a `llama serve` router, which
# otherwise answers /props about itself and reports no slots at all. Set it only to
# override what the server says — e.g. to throttle a shared endpoint.
# embed_concurrency = 4

# Auto-start: when true and base_url is unreachable, omniscient launches llama.cpp
# itself (`llama serve -hf <hf_repo> --alias <model> --port <port> --embedding
# --pooling <pooling>`) and kills it on exit. Off by default; an already-running
# endpoint is reused as-is. Only manages a LOCAL server (a remote base_url is an
# error). Requires the unified `llama` CLI on PATH (or set llama_bin to its
# absolute path).
#
# `--alias <model>` makes the spawned server register under the id in `model`
# whatever hf_repo says, so on this path the two cannot drift: change either and
# auto-start still connects.
auto_start = false
llama_bin = "llama"                                 # llama.cpp CLI binary
hf_repo = "Qwen/Qwen3-Embedding-0.6B-GGUF:Q8_0"     # GGUF repo[:quant], downloaded on first run
pooling = "last"                                    # last = Qwen3-Embedding; mean = BERT-family
auto_start_timeout_secs = 600                       # max seconds to wait for readiness
request_timeout_secs = 30                           # seconds per HTTP embedding request

[search]
# Results are selected by the *shape* of the relevance scores, not a fixed count:
# every hit scoring at least relevance_ratio of the top hit is returned (so a sharp
# query yields few results, a broad one yields many). max_results is a safety ceiling
# and token_budget a hard cap; the single best match is always returned.
relevance_ratio = 0.75   # keep hits within 75% of the top hit's score
max_results = 25         # ceiling on candidates fetched + results returned
token_budget = 4000
search_timeout_secs = 60   # seconds for entire search (ensure_fresh + embed + index + distill)

[watch]
enabled = true      # set false to disable the filesystem watcher
debounce_ms = 200   # coalesce bursts of FS events into one reconcile
